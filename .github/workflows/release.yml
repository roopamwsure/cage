name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]

          version = project["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"

          if tag != expected:
              raise SystemExit(
                  f"Release tag mismatch: tag={tag!r}, expected={expected!r}"
              )

          print(f"Release identity verified: {tag} -> {project['name']} {version}")
          PY

      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify distributions exist
        shell: bash
        run: |
          test -f dist/cage_assurance-*.whl
          test -f dist/cage_assurance-*.tar.gz
          ls -la dist

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/cage-assurance

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
