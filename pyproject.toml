[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-assurance"
version = "0.6.0"
description = "Control Assurance Governance Evaluation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
cage = "cage.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cage-assurance/examples" = [
    "examples/sqlite_delete.py",
    "examples/sqlite_reconcile.py",
    "examples/sqlite_access_grant.py",
    "examples/simulated_payment_release.py",
]
"share/cage-assurance/docs" = [
    "docs/quickstart.md",
    "docs/reconciliation-walkthrough.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
