[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-assurance"
version = "0.7.1"
description = "Assurance SDK for consequential actions by AI agents and automated systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Roopam Sure" },
]
keywords = [
    "ai-agents",
    "assurance",
    "governance",
    "verification",
    "idempotency",
    "reconciliation",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/roopamwsure/cage"
Repository = "https://github.com/roopamwsure/cage"
Issues = "https://github.com/roopamwsure/cage/issues"
Documentation = "https://github.com/roopamwsure/cage/tree/main/docs"

[project.scripts]
cage = "cage.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cage-assurance/examples" = [
    "examples/sqlite_delete.py",
    "examples/sqlite_reconcile.py",
    "examples/sqlite_access_grant.py",
    "examples/simulated_payment_release.py",
]
"share/cage-assurance/docs" = [
    "docs/quickstart.md",
    "docs/reconciliation-walkthrough.md",
    "docs/semantic-guide.md",
    "docs/integration-guide.md",
    "docs/failure-and-recovery.md",
    "docs/portable-warrants-and-cli.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
